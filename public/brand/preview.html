<!doctype html>
<html><head><meta charset="utf-8"><title>Clasp mark preview</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
body{background:#F4F1EA;font-family:system-ui;margin:40px;color:#141413}
.row{display:flex;gap:40px;align-items:center;margin-bottom:40px}
.word{font-family:Newsreader,serif;font-weight:600;letter-spacing:-0.02em}
.lock{display:flex;align-items:center;gap:12px}
.card{background:#FBF9F5;border:1px solid #E6E1D6;border-radius:10px;padding:24px}
.dark{background:#141413;color:#F4F1EA}
</style></head><body>
<div class="row">
  <img src="mark.svg" width="256"><img src="mark.svg" width="96"><img src="mark.svg" width="48"><img src="mark.svg" width="24"><img src="mark.svg" width="16">
</div>
<div class="row card">
  <div class="lock"><img src="mark.svg" width="40"><span class="word" style="font-size:34px">Clasp</span></div>
  <div class="lock"><img src="mark.svg" width="28"><span class="word" style="font-size:24px">Clasp</span></div>
</div>
<div class="row card dark">
  <div class="lock"><img src="mark-light.svg" width="40"><span class="word" style="font-size:34px">Clasp</span></div>
</div>
<div style="text-align:center;padding:40px" class="card">
  <img src="mark.svg" width="160"><div class="word" style="font-size:72px;margin-top:8px">Clasp</div>
  <div style="letter-spacing:0.18em;font-size:14px;color:#6F6A62;margin-top:6px">REAL ITEMS. REAL PAYMENTS.</div>
</div>
</body></html>
